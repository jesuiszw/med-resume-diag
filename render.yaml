# Render Blueprint — 医药简历诊断工具
# https://render.com/docs/blueprint-spec
# 部署后生成两个服务：
#   后端 API: https://med-resume-diag-api.onrender.com
#   前端 Web: https://med-resume-diag-web.onrender.com

services:
  # ─── 后端 API 服务 ───
  - type: web
    name: med-resume-diag-api
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  # ─── 前端静态站点 ───
  - type: static
    name: med-resume-diag-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishDir: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://med-resume-diag-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
