# Render Blueprint — 医药简历诊断工具 (单服务架构)
# 后端 Express 同时托管前端静态文件，一个服务搞定一切
# 部署后访问地址: https://med-resume-diag.onrender.com

services:
  - type: web
    name: med-resume-diag
    env: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
